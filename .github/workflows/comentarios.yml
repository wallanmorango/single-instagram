name: Comentário vira DM

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-comentarios
  cancel-in-progress: false

jobs:
  comentarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      COMMIT_MSG: "Atualiza comentários atendidos"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Atender comentários com palavra-chave
        run: python scripts/comentarios.py
      - name: Salvar estado no repositório
        if: always()
        run: |
          git config user.name "single-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts estado relatorios
          if git diff --cached --quiet; then echo "Nada para salvar."; exit 0; fi
          git commit -m "$COMMIT_MSG"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
