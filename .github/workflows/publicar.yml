name: Publicar post do dia

on:
  schedule:
    - cron: "40 14 * * 1-5"   # 11:40 em Brasília, de segunda a sexta
  workflow_dispatch:
    inputs:
      data:
        description: "Data do post (AAAA-MM-DD). Vazio = hoje"
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      COMMIT_MSG: "Registra publicação do dia"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Publicar
        run: |
          if [ -n "${{ github.event.inputs.data }}" ]; then
            python scripts/publicar.py --data "${{ github.event.inputs.data }}"
          else
            python scripts/publicar.py
          fi
      - name: Salvar estado no repositório
        if: always()
        run: |
          git config user.name "single-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in posts estado relatorios; do [ -e "$d" ] && git add -A "$d"; done
          if git diff --cached --quiet; then echo "Nada para salvar."; exit 0; fi
          git commit -m "$COMMIT_MSG"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
