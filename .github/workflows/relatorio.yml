name: Relatório semanal

on:
  schedule:
    - cron: "10 11 * * 1"   # segunda, 8:10 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      COMMIT_MSG: "Relatório semanal do Instagram"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Gerar relatório
        run: python scripts/relatorio.py
      - name: Salvar estado no repositório
        if: always()
        run: |
          git config user.name "single-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts estado relatorios
          if git diff --cached --quiet; then echo "Nada para salvar."; exit 0; fi
          git commit -m "$COMMIT_MSG"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
