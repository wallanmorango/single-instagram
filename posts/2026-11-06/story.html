<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Story</title>
<link rel="stylesheet" href="../../templates/base.css">
<style>

.chamada .titulo { font-size: 92px; }
.chamada .apoio { font-size: 38px; max-width: 820px; }
